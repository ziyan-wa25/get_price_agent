name: Build Windows App (Tauri)

on:
  workflow_dispatch:
  push:
    tags:
      - 'app-v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存（第二次起快很多）
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Tauri CLI
        run: npm install -g @tauri-apps/cli@^2
        shell: pwsh

      - name: 打包 Windows 安装程序（界面取自 frontend/，静态嵌入）
        run: tauri build
        shell: pwsh

      - name: 上传安装包（Actions 页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: XCHQuote-Windows-setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
