name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # deploy-pages 需要查询本 run 的 artifact 元数据（缺它会出现 "No artifacts named github-pages"）

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 显式打包（upload-pages-artifact@v3 曾间歇性"上传成功但找不到 artifact"，
      # 改为手工 tar + upload-artifact@v4：deploy-pages 期望名为 github-pages 的 artifact 内含 artifact.tar）
      - name: Package frontend
        run: tar -cf artifact.tar -C frontend .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
